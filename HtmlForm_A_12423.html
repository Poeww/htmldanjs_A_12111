  <h2>Form Pendaftaran Mahasiswa</h2>

  <form onsubmit="return validateForm()">
    <table cellspacing="4" cellpadding="4">
      <!-- TODO: Tambahkan field input teks untuk Nama Mahasiswa dengan tipe teks dan WAJIB DIISI. -->
       <tr>
        <td><strong>Nama Mahasiswa</strong></td>
        <td><input required type="text" id="namamhs" name="namamhs" size="30"/></td>
       </tr>

      <!-- TODO: Tambahkan field radio button untuk Jenis Kelamin (Laki-laki dan Perempuan) dan WAJIB DIISI -->
       <tr>
        <td><strong>Jenis Kelamin</strong></td>
        <td>
          <input required type="radio" id="laki" name="gender" value="Laki-laki"/>
          <label for="laki">Laki-laki</label>
          <input required type="radio" id="perempuan" name="gender" value="Perempuan"/>
          <label for="perempuan">Perempuan</label>
        </td>
       </tr>

      <!-- TODO: Tambahkan dropdown untuk Program Studi dengan id="prodi", opsi: "Pilih Prodi", "Informatika", "Teknik Industri", "Sistem Informasi" dan WAJIB DIISI. -->
       <tr>
        <td><strong>Program Studi</strong></td>
        <td>
          <select required id="prodi" name="prodi">
            <option value="">Pilih Prodi</option>
            <option value="Informatika">Informatika</option>
            <option value="Teknik Industri">Teknik Industri</option>
            <option value="Sistem Informasi">Sistem Informasi</option>
          </select>
        </td>
       </tr>

      <!-- TODO: Tambahkan field input angka untuk Nomor Telepon dengan tipe number dan WAJIB DIISI. -->
       <tr>
        <td><strong>Nomor Telepon</strong></td>
        <td><input required type="number" id="telp" name="telp"/></td>
       </tr>

      <!-- TODO: Tambahkan field input tanggal untuk Tanggal Lahir dengan tipe date dan WAJIB DIISI. -->
       <tr>
        <td><strong>Tanggal Lahir</strong></td>
        <td><input required type="date" id="tgllahir" name="tgllahir"/></td>
       </tr>

      <!-- TODO: Tambahkan field input email dengan tipe email dan WAJIB DIISI. -->
       <tr>
        <td><strong>Email</strong></td>
        <td><input required type="email" id="email" name="email" /></td>
       </tr>

      <!-- TODO: Tambahkan field input password dengan tipe password dan WAJIB DIISI. -->
       <tr>
        <td><strong>Password</strong></td>
        <td><input required type="password" id="password" name="password"/></td>
       </tr>

      <!-- TODO: Tambahkan fieldset untuk Hal Favorit, berisi:
           - Fieldset "Game" dengan checkbox untuk Roblox, Magic Chess, dan beberapa game lain yang ingin kamu tambahkan.
           - Fieldset "Film" dengan checkbox untuk Drama, Action, Romance, Comedy, Horror.
       -->
       <tr>
        <td><strong>Hal Favorit</strong></td>
        <td>
          <p><strong>Tempat Liburan</strong><br>
            <input type="checkbox" name="liburan" value="Pantai"> Pantai
            <input type="checkbox" name="liburan" value="Gunung"> Gunung
            <input type="checkbox" name="liburan" value="Kota"> Kota
            <input type="checkbox" name="liburan" value="Desa"> Desa
          </p>
          <p><strong>Hobi</strong><br>
            <input type="checkbox" name="hobi" value="Membaca"> Membaca
            <input type="checkbox" name="hobi" value="Olahraga"> Olahraga
            <input type="checkbox" name="hobi" value="Traveling"> Traveling
            <input type="checkbox" name="hobi" value="Ngoding"> Ngoding
          </p>
          <p><strong>Makanan</strong><br>
            <input type="checkbox" name="makanan" value="Bakso"> Bakso
            <input type="checkbox" name="makanan" value="Mie Ayam"> Mie Ayam
            <input type="checkbox" name="makanan" value="Sate"> Sate
            <input type="checkbox" name="makanan" value="Pizza"> Pizza
          </p>
        </td>
       </tr>
           
      <!-- TODO: Tambahkan textarea untuk Deskripsi dengan id="deskripsi" dan WAJIB DIISI. -->

      <!-- TODO: Tambahkan field input Foto dengan tipe file dan WAJIB DIISI. -->

      <!-- TODO: Tambahkan tombol submit dengan id="simpan" dan value="Simpan". -->

            <tr>
              <td><strong>Nama Mahasiswa</strong></td>
              <td><input required type="text" id="namamhs" name="namamhs" size="30" /></td>
            </tr> 
      -->

    </table>
  </form>

    const validateForm = () =>alert("Data Berhasil Disimpan !");
